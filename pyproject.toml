[project]
name = "sphinx-rustdoc"
version = "0.1.0"
description = "A Sphinx API reference for Rust crates, built from rustdoc's JSON output"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "sphinx>=9.1",
    # the generated pages are MyST Markdown, and so are doc comments
    "myst-parser>=5.0",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sphinx_rustdoc"]
